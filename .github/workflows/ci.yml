name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: make gen-check

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: cd server && go vet ./... && go test ./...
      - run: test -z "$(cd server && gofmt -l .)"

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cd desktop && pnpm install --frozen-lockfile
      - run: cd desktop && pnpm exec tsc --noEmit && pnpm test && pnpm build
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      # The netboot helper the Desktop bundles (decision 92); Tauri refuses to
      # compile without it. Plain shell: make is not a given on every runner.
      - shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p'); ext=; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p desktop/src-tauri/binaries
          (cd server && go build -o "../desktop/src-tauri/binaries/maitre-${triple}${ext}" ./cmd/maitre)
      - run: cd desktop/src-tauri && cargo test --lib
      - run: cd desktop && pnpm tauri build --no-bundle

  # aarch64 image: built and pushed, not boot-tested, not released (Milestone 7).
  image-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: make image VERSION=${{ github.sha }}-arm64
      - if: github.event_name == 'push'
        run: |
          set -eu
          OWNER=${{ github.repository_owner }}; REF=ghcr.io/${OWNER,,}/maitre-server
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag localhost/maitre-server:${{ github.sha }}-arm64 "$REF:main-arm64"
          podman push "$REF:main-arm64"

  m0-check:
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: make m0-check
      - run: make m1-check
      - run: make m3-check

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless Sigstore signing of the published image (Milestone 6).
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v3
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: make image VERSION=${{ github.sha }}
      # Plan C8, the Catalog's second check: every entry renders and passes
      # the Quadlet of the image it ships in, with no grants needed.
      - run: podman run --rm -v "$PWD/catalog/entries:/entries:ro,z" --entrypoint /usr/bin/maitre localhost/maitre-server:${{ github.sha }} catalog-check /entries
      # The third check's list: entries this change touches.
      - id: entries
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --quiet --depth=1 origin "$base"; then
            echo "ids=$(scripts/changed-entries.sh "$base" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else echo "no base commit; no Catalog entries installed"; fi
      # Full Milestone 1 demo: boot the image as installer media, provision it
      # from the host, reboot into the Node. Needs rootful podman + KVM. Then
      # the Catalog's third check: the changed entries install and are healthy.
      - run: |
          if [ -e /dev/kvm ]; then sudo apt-get install -y qemu-system-x86 qemu-utils ovmf && make image-boot VERSION=${{ github.sha }}; \
          else echo "no /dev/kvm on this runner; boot test skipped"; fi
        env:
          CATALOG_ENTRIES: ${{ steps.entries.outputs.ids }}
      # On main: publish the image to GHCR and build installer media that
      # pulls it from there, for `make dev-qemu` and for real USB sticks.
      - if: github.event_name == 'push'
        run: |
          set -eu
          OWNER=${{ github.repository_owner }}; REF=ghcr.io/${OWNER,,}/maitre-server
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag localhost/maitre-server:${{ github.sha }} "$REF:${{ github.sha }}"
          podman tag localhost/maitre-server:${{ github.sha }} "$REF:main"
          podman push "$REF:${{ github.sha }}"
          podman push "$REF:main"
          # Sign by digest with the workflow's GitHub identity (keyless, Rekor-logged).
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://$REF:${{ github.sha }}")
          cosign sign --yes "$REF@$DIGEST" || echo "::warning::image signing failed; continuing (Milestone 6: signing may slip)"
          # tty0 last so the installer's status screen lands on the VM's display.
          image/installer-media.sh localhost/maitre-server:${{ github.sha }} "$REF:${{ github.sha }}" "$PWD/media" \
            console=ttyS0,115200n8 console=tty0
          mv "$(find media -name '*.qcow2' | head -1)" media/maitre-installer.qcow2
          # Raw image for USB sticks (Milestone 7: the Console writes it).
          qemu-img convert -O raw media/maitre-installer.qcow2 media/maitre-installer.img && xz -T0 -3 media/maitre-installer.img
          echo "$REF:${{ github.sha }}" > media/image-ref.txt
          # Ship the firmware that booted this media in the boot test (edk2 202505+ faults in GRUB).
          sudo apt-get install -y ovmf >/dev/null
          cp /usr/share/OVMF/OVMF_CODE_4M.fd media/OVMF_CODE.fd; cp /usr/share/OVMF/OVMF_VARS_4M.fd media/OVMF_VARS.fd
          # Netboot bundle for Maître Desktop (decision 93): shim, GRUB, kernel,
          # live initramfs, squashed root, and netboot.json naming the image.
          ./server/bin/maitre depot publish localhost/maitre-server:${{ github.sha }} --dir "$PWD/depot" --tag ci --netboot --image-ref "$REF:${{ github.sha }}"
          rm -f depot/boot/grub.cfg; rm -rf depot/boot/EFI
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: installer-media
          path: |
            media/maitre-installer.qcow2
            media/maitre-installer.img.xz
            media/image-ref.txt
            media/OVMF_CODE.fd
            media/OVMF_VARS.fd
          compression-level: 0
          retention-days: 14
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: netboot
          path: depot/boot/
          compression-level: 0
          retention-days: 14
      # A tag publishes the bundle as release assets, where Maître Desktop
      # downloads it from (releases/latest/download/<file>).
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "Maître Server ${GITHUB_REF_NAME}" --notes "Image: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/maitre-server:${{ github.sha }}" || true
          gh release upload "${GITHUB_REF_NAME}" depot/boot/* media/maitre-installer.qcow2 media/maitre-installer.img.xz --clobber
