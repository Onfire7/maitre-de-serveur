name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: make gen-check

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: cd server && go vet ./... && go test ./...
      - run: test -z "$(cd server && gofmt -l .)"

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cd desktop && pnpm install --frozen-lockfile
      - run: cd desktop && pnpm exec tsc --noEmit && pnpm test && pnpm build
      - run: cd desktop/src-tauri && cargo test --lib
      - run: cd desktop && pnpm tauri build --no-bundle

  m0-check:
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: make m0-check
      - run: make m1-check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image VERSION=${{ github.sha }}
      # Boot test needs rootful podman + KVM. Enabled once the runner is confirmed to have /dev/kvm.
      - run: |
          if [ -e /dev/kvm ]; then sudo apt-get install -y qemu-system-x86 && make image-boot VERSION=${{ github.sha }}; \
          else echo "no /dev/kvm on this runner; boot test skipped"; fi
