id: jellyfin
name: Jellyfin
summary: Stream your movies, shows and music to any device.
description: |
  Jellyfin is a free media system. Point it at your films, series, music and
  photos and watch them from your TV, phone or browser.
icon: https://raw.githubusercontent.com/jellyfin/jellyfin-ux/master/branding/SVG/icon-transparent.svg
category: media
image: docker.io/jellyfin/jellyfin:10.10.7@sha256:7ae36aab93ef9b6aaff02b37f8bb23df84bb2d7a3f6054ec8fc466072a648ce2
version: "10.10.7"
exposure: remote
own_login: true
web:
  port: 8096
  path: /
volumes:
  - name: config
    path: /config
  - name: cache
    path: /cache
  - name: media
    path: /media
    size: large
settings:
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /health
