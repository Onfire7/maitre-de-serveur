# Decision 327. A Service that publishes a port on a named address of the
# Node, rather than on every address it has, is bound before that address
# necessarily exists: an infrastructure Service starts at basic.target,
# which is ahead of DHCP, and a bind to an address the host has not been
# given yet fails with EADDRNOTAVAIL. The failure would then hold for an
# hour on the unit's start limit, which for the home's DNS is the whole
# evening. Letting the bind happen early and the packets arrive once the
# address does is what keepalived and HAProxy ask for the same way.
#
# It permits nothing but binding an address the host does not hold; it
# opens no port and reaches no network.
net.ipv4.ip_nonlocal_bind = 1
