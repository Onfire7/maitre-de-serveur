# Decision 322: the Node swaps to compressed RAM, not to a disk.
#
# Nothing configured swap before this, so a memory spike was terminal and
# the kernel picked a Service to kill. A swap file has nowhere good to
# live: /var/swapfile sits on the root partition that decisions 319 and 321
# are trying to relieve, the data partition does not exist on a USB
# install and swapping to flash is the wear the Installer avoids, a Pool
# Drive means swapping to a spinning disk and must not go through
# MergerFS, and root is xfs, where a swap file has to be free of holes and
# fallocate's unwritten extents have historically been refused by swapon.
#
# zram costs no disk at all, so it behaves the same on a USB install, needs
# no partition and no filesystem, and compresses at roughly 2-3x. It also
# softens the /tmp question, since tmpfs pages are swappable: a runaway
# /tmp compresses into RAM instead of ending the Node.
#
# Sized modestly on purpose. Swap trades a fast failure for thrashing, and
# a server often wants the fast one: this is here to absorb a spike, not to
# let a Node run indefinitely past its memory. A quarter of RAM, never more
# than 4 GiB. Hibernation is the one thing this gives up, and a server does
# not want it (sleep.target and friends are masked).
[zram0]
zram-size = min(ram / 4, 4096)
compression-algorithm = zstd
swap-priority = 100
# Writeback to a disk would undo the point of it.
