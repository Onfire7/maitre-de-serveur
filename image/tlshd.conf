# tlshd for NFS over TLS (decision 188). The agent writes the files named
# here: this Node's certificate and key (made from its identity key), and
# fleet.pem, the other Nodes' certificates from their Node records. Both
# sides use the same files: a Node is client when it mounts a peer's Pool
# and server when a peer mounts one of its own.

[debug]
loglevel=0
tls=0
nl=0

[authenticate.client]
x509.truststore=/etc/pki/tlshd/fleet.pem
x509.certificate=/etc/pki/tlshd/node.crt
x509.private_key=/etc/pki/tlshd/node.key

[authenticate.server]
x509.truststore=/etc/pki/tlshd/fleet.pem
x509.certificate=/etc/pki/tlshd/node.crt
x509.private_key=/etc/pki/tlshd/node.key
