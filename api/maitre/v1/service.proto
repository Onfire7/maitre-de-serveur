syntax = "proto3";

package maitre.v1;

option go_package = "github.com/Onfire7/maitre-de-serveur/server/gen/maitre/v1;maitrev1";

// ServiceService manages Services on the Node that serves it. Definitions
// are Records of kind "service" owned by the running Node (ADR 0003); these
// calls change the Record and apply it, so the Console never edits Quadlet
// files or talks to Podman.
service ServiceService {
  // GetCatalog returns the Catalog index this Node currently holds.
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse) {}
  // InstallService creates a Service from a Catalog entry and starts it.
  rpc InstallService(InstallServiceRequest) returns (InstallServiceResponse) {}
  // ControlService starts, stops, restarts or removes a Service.
  rpc ControlService(ControlServiceRequest) returns (ControlServiceResponse) {}
  // ListServices returns every Service on this Node with live status.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse) {}
  // GetServiceLogs returns the last lines of a Service's log.
  rpc GetServiceLogs(GetServiceLogsRequest) returns (GetServiceLogsResponse) {}
  // SetExposure changes where a Service is reachable: "private" (LAN and
  // the Console's tunnel), "remote" (the Fleet's tailnet), "public"
  // (the internet through Tailscale Funnel). Milestone 5.
  rpc SetExposure(SetExposureRequest) returns (SetExposureResponse) {}
  // Decision 115: ask the router to forward a Service's host_ports from the
  // internet (UPnP), or stop doing so.
  rpc SetPortForwarding(SetPortForwardingRequest) returns (SetPortForwardingResponse) {}
  // MoveVolume moves one of a Service's volumes to another Space on this
  // Node: the Service stops, the folder moves as a file manager job (copy,
  // verify, remove), the spec's volume_spaces is rewritten, and the Service
  // starts again if it was running. Returns the job id for ListJobs.
  rpc MoveVolume(MoveVolumeRequest) returns (MoveVolumeResponse) {}
  // SetFolders points volumes at picked folders and sets the extra folders
  // (decisions 170, 171, 174): saved, applied, and the Service restarted if
  // it was running. A folder that is no longer used stays where it is.
  rpc SetFolders(SetFoldersRequest) returns (SetFoldersResponse) {}
  // SetSettings replaces a Service's settings and, when given, whether it
  // updates by itself (decision 193): saved, applied, and the Service
  // restarted if it was running.
  rpc SetSettings(SetSettingsRequest) returns (SetSettingsResponse) {}
  // SetImage runs a Service on another image (decision 195): pulled,
  // pinned to its digest, the old one kept for Rollback, and the Service
  // restarted if it was running.
  rpc SetImage(SetImageRequest) returns (SetImageResponse) {}
}

message SetImageRequest {
  string name = 1;
  // An image reference such as docker.io/jellyfin/jellyfin:10.11, with or
  // without a digest. Without one, the tag's current digest is pinned.
  string image = 2;
  // Which component to change in a multi-container Service; empty means the
  // single container, or every component that runs this image.
  string component = 3;
}

message SetImageResponse {
  ServiceStatus service = 1;
}

message SetSettingsRequest {
  string name = 1;
  // The complete settings, key -> value, as ServiceSpec.settings; a key
  // left out is removed. TZ=auto becomes the Node's time zone.
  map<string, string> settings = 2;
  // Left unset: unchanged.
  optional bool auto_update = 3;
}

message SetSettingsResponse {
  ServiceStatus service = 1;
}

message SetFoldersRequest {
  string name = 1;
  // As ServiceSpec.volume_folders: volume name -> folder in its Space;
  // a volume left out gets its own folder again. volume_spaces gives the
  // Space for each named volume (left out: unchanged).
  map<string, string> volume_folders = 2;
  map<string, string> volume_spaces = 3;
  repeated ServiceMount mounts = 4;
}

message SetFoldersResponse {
  ServiceStatus service = 1;
}

message MoveVolumeRequest {
  string name = 1;
  string volume = 2;
  string to_space = 3;
}

message MoveVolumeResponse {
  string job_id = 1;
}

message GetCatalogRequest {}

message GetCatalogResponse {
  // The raw index.json (catalog/FORMAT.md); the Console parses it.
  bytes index_json = 1;
  // Where it came from and when, for the Console to show.
  string source = 2;
  int64 fetched_unix_ms = 3;
}

// ServiceComponent is one container of a multi-container Service (plan C1).
// Its quadlet is a [Container] template exactly like ServiceSpec.quadlet; the
// Node fills .Image, .Name, .Volumes, .Settings, .Network and .Env. Volumes
// are the Service's (project-level); a component mounts the ones it names.
message ServiceComponent {
  // [a-z0-9-], unique within the Service. The container and unit are named
  // <service>-<name>; the component resolves on the Service network as <name>.
  string name = 1;
  // Image deployed, pinned by digest. Auto-update advances it per component.
  string image = 2;
  // The image before the last update, pinned by digest, for Rollback.
  string previous_image = 3;
  // The [Container] body as a Go text/template (catalog/FORMAT.md).
  string quadlet = 4;
  // Components that must start first (compose depends_on). Names in this
  // Service; the Node writes After= and Requires=.
  repeated string after = 5;
  // Dependants wait for this component's health check, not just its start
  // (compose service_healthy). The Node writes Notify=healthy.
  bool wait_healthy = 6;
  // Reaches the internet even when the Service network is internal (plan C2):
  // the Node puts it on a second network with a route out.
  bool egress = 7;
}

// ServiceUnit is an extra Quadlet unit a bundle ships beside its containers,
// such as a .volume or .network (plan C8). name is the file name without the
// <service>- prefix the Node adds, e.g. "cache.volume".
message ServiceUnit {
  string name = 1;
  string body = 2;
}

// ServiceVolume is a named data directory of a Service.
message ServiceVolume {
  string name = 1;
  // Mount point inside the container.
  string path = 2;
  // Suggested size, informational.
  string size = 3;
  // Decision 175: the Catalog suggests pointing this volume at a folder the
  // user picks (a media library other Services use too) rather than giving
  // it a folder of its own.
  bool shared = 4;
}

// ServiceMount is an extra folder of a Space mounted into a Service
// (decision 171), e.g. Media/Movies at /media/movies.
message ServiceMount {
  string space_id = 1;
  // Folder in the Space, relative; "" is the Space's top.
  string folder = 2;
  // Absolute path inside the container.
  string path = 3;
  bool read_only = 4;
}

// ServiceSpec is the kind "service" Record body: everything the Node needs
// to run the Service (decision 78). The Console builds it from a Catalog
// entry plus the user's choices; the Node keeps no Catalog knowledge, so
// custom and customised Services need nothing new on the Node.
message ServiceSpec {
  // Unique within the Fleet; also the mDNS name <name>.local.
  string name = 1;
  string catalog_id = 2;
  // Image actually deployed, pinned by digest. Auto-update advances it.
  string image = 3;
  string node_id = 4;
  // Setting key -> value, as entered at install.
  map<string, string> settings = 5;
  // Exposure level: "private" | "remote" | "public" | "direct".
  // remote and public go through Tailscale (tailnet, Funnel); direct is the
  // user's own domain name with a certificate Caddy obtains itself.
  string exposure = 6;
  // For "direct": the host name the Service answers at, e.g. photos.example.com.
  string public_host = 19;
  // Space for each volume (volume name -> space id). Empty entries are filled at
  // install with the Space marked default_for_new; install fails if none is.
  map<string, string> volume_spaces = 7;
  // Reserved for Members (gated access): "" | "admins" | "members".
  string access_policy = 8;
  int64 created_unix_ms = 9;
  // Loopback port on the Node where the web port is published; chosen by
  // the agent, used by Caddy and health checks. 0 for headless Services.
  uint32 web_host_port = 10;
  // The image before the last update, pinned by digest, for Rollback.
  string previous_image = 17;
  // Check for and apply image updates by itself (daily).
  bool auto_update = 18;
  // The Quadlet [Container] body as a Go text/template (catalog/FORMAT.md).
  string quadlet = 11;
  // Started before the network is "online" (DNS, DHCP).
  bool infrastructure = 12;
  // Container port and path of the web page; 0 means headless.
  uint32 web_port = 13;
  string web_path = 14;
  // HTTP path probed for health; empty means the web path.
  string health_http = 15;
  repeated ServiceVolume volumes = 16;
  // A multi-container Service's components (plan C1). Empty for a
  // single-container Service, where image, previous_image and quadlet above
  // describe the one container and the Node writes <name>.container as
  // before. With components set, the Node writes one <name>-<component>.container
  // per entry, a <name>.target that groups them, and a <name>.network they
  // share; image/previous_image/quadlet at this level are then unused.
  repeated ServiceComponent components = 24;
  // Which component serves the web page (web_port, web_path, health_http,
  // exposure). Empty for a single-container Service.
  string web_component = 25;
  // Extra .volume and .network units the bundle ships (plan C8); rare, since
  // volumes are folders in Spaces and the Node supplies the network.
  repeated ServiceUnit units = 26;
  // The Service's own network has no route out (plan C2, Q1). A component
  // marked egress still reaches the internet through a second network.
  bool network_internal = 27;
  // Ports the app owns on the Node itself, "25565/tcp" style (from the
  // Catalog entry's host_ports).
  repeated string host_ports = 20;
  // Decision 115: the user asked the Node to have the router forward
  // host_ports from the internet (UPnP). Off unless explicitly enabled.
  bool forward_ports = 21;
  // Decision 170: volume name -> a folder in its Space (volume_spaces) the
  // user picked, relative to the Space's top. A volume not listed has its
  // own folder, <Space>/<service>/<volume>. Picked folders mount with :z,
  // shared with other containers (172).
  map<string, string> volume_folders = 22;
  // Decision 171: extra folders beyond the Catalog's volumes.
  repeated ServiceMount mounts = 23;
}

message ServiceStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_STOPPED = 1;
    STATE_STARTING = 2;
    STATE_RUNNING = 3;
    STATE_FAILED = 4;
    STATE_REMOVING = 5;
  }
  ServiceSpec spec = 1;
  State state = 2;
  // Health according to the Catalog entry's check, when running.
  bool healthy = 3;
  uint32 restarts = 4;
  // Human-readable reason when failed.
  string message = 5;
  // Where the Console opens it, e.g. "http://jellyfin.local". Empty if headless.
  string url = 6;
  int64 started_unix_ms = 7;
  // Where the Service answers on the tailnet or the internet
  // (https://<name>.<tailnet>.ts.net) once its node is up; empty otherwise.
  string remote_url = 8;
  // The tailnet node's state or problem, for the Console.
  string remote_state = 9;
  // Decision 115: the router port forwarding this Service depends on
  // (its own host_ports, or 80/443 for a "direct" Service); empty when none.
  string forward_state = 10;
  // Per-component status for a multi-container Service (plan C1); empty for a
  // single-container one. The fields above are the Service-wide rollup.
  repeated ComponentStatus components = 11;
}

// ComponentStatus is one container's state within a multi-container Service.
message ComponentStatus {
  string name = 1;
  ServiceStatus.State state = 2;
  bool healthy = 3;
  uint32 restarts = 4;
  string message = 5;
}

// Decision 114: Fleet-wide settings for Services published at the user's
// own domain. Record kind "public_settings", id "fleet".
message PublicSettings {
  // Optional email given to the certificate authority (Let's Encrypt) for
  // expiry and policy notices. Empty means none.
  string acme_email = 1;
}

message SetPortForwardingRequest {
  string name = 1;
  bool enabled = 2;
}

message SetPortForwardingResponse {
  ServiceStatus service = 1;
}

message InstallServiceRequest {
  reserved 1 to 4;
  // The complete Service to run. The Node fills node_id, created_unix_ms,
  // web_host_port and volume_spaces; a setting TZ=auto becomes the Node's
  // time zone.
  ServiceSpec spec = 5;
}

message InstallServiceResponse {
  ServiceStatus service = 1;
}

message ControlServiceRequest {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_START = 1;
    ACTION_STOP = 2;
    ACTION_RESTART = 3;
    // Remove the Service and its units. Data stays on the Pool unless
    // delete_data is set.
    ACTION_REMOVE = 4;
    // Pull the newest image behind the Service's tag and restart on it,
    // remembering the previous pinned image (Milestone 6).
    ACTION_UPDATE = 5;
    // Go back to the previous pinned image.
    ACTION_ROLLBACK = 6;
  }
  string name = 1;
  ControlServiceRequest.Action action = 2;
  bool delete_data = 3;
}

message ControlServiceResponse {
  ServiceStatus service = 1;
}

message ListServicesRequest {}

message ListServicesResponse {
  repeated ServiceStatus services = 1;
}

message SetExposureRequest {
  string name = 1;
  string exposure = 2;
  // Required when exposure is "direct".
  string public_host = 3;
}

message SetExposureResponse {
  ServiceStatus service = 1;
}

message GetServiceLogsRequest {
  string name = 1;
  // Default 200.
  uint32 lines = 2;
  // One component of a multi-container Service; empty interleaves them all.
  string component = 3;
}

message GetServiceLogsResponse {
  repeated string lines = 1;
}
