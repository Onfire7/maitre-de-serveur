syntax = "proto3";

package maitre.v1;

import "maitre/v1/fleet.proto";
import "maitre/v1/installer.proto";
import "maitre/v1/service.proto";
import "maitre/v1/tailscale.proto";

option go_package = "github.com/Onfire7/maitre-de-serveur/server/gen/maitre/v1;maitrev1";

// NodeService is served by every Node (and by the agent in dev mode).
// Callers are Trusted Devices and peer Nodes; the transport is mutual TLS
// checked against the Fleet trust list, so no auth fields appear here.
//
// The core (ADR 0007): GetNodeInfo, GetUpdateStatus, UpdateImage, Rollback
// and Reboot, with their messages, never lose a field, change a field's
// meaning or refuse a request an older caller could send. Every Node keeps
// answering them, so any Node, however old, can be seen and updated. A peer
// is online when it answers GetNodeInfo (or gossips); a failure of any
// other call is a problem with that Node, never a reason to call it offline.
service NodeService {
  // GetNodeInfo returns identity and liveness facts about this Node. Core.
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse) {}
  // ListRecords returns this Node's copy of the Fleet database, optionally
  // filtered by kind. Reads are always local (ADR 0003).
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse) {}
  // PutRecord writes a Record. If this Node owns it the write is applied and
  // the stored Record returned; otherwise it is forwarded to the owner, or
  // queued if the owner is offline. Version and owner in the request are
  // ignored; the caller sends the body it wants.
  rpc PutRecord(PutRecordRequest) returns (PutRecordResponse) {}
  // GetNodeMetrics returns the gauges the Console shows for this Node.
  rpc GetNodeMetrics(GetNodeMetricsRequest) returns (GetNodeMetricsResponse) {}
  // GetUpdateStatus reports the booted, staged and rollback images (bootc
  // status) and any update in progress. Core.
  rpc GetUpdateStatus(GetUpdateStatusRequest) returns (GetUpdateStatusResponse) {}
  // UpdateImage stages a new Maître Server image (bootc switch) in the
  // background and returns at once; poll GetUpdateStatus for progress. With
  // reboot set, the Node reboots into the new image as soon as it is staged.
  // Core.
  rpc UpdateImage(UpdateImageRequest) returns (UpdateImageResponse) {}
  // Rollback makes the previous image the next boot target (bootc rollback)
  // and reboots when asked. Core.
  rpc Rollback(RollbackRequest) returns (RollbackResponse) {}
  // Reboot restarts the Node. Core.
  rpc Reboot(RebootRequest) returns (RebootResponse) {}
  // Give this Node a new name: its record, host name and mDNS announcement
  // follow at once; its Tailscale name on the next start.
  rpc RenameNode(RenameNodeRequest) returns (RenameNodeResponse) {}
  // PushRecords hands this Node Records another Node (or a device) holds,
  // applied newest-wins (ADR 0003). Peers call it after every write and the
  // periodic reconcile pulls ListRecords the other way.
  rpc PushRecords(PushRecordsRequest) returns (PushRecordsResponse) {}
  // GetFleetStatus returns what this Node knows about every Node of the
  // Fleet, itself included: the last metrics sample and Service statuses
  // each Node gossiped and when, plus whether this Node can reach it
  // (ADR 0006). Nothing here is stored; a Node that just started knows only
  // itself until the peers' next samples arrive.
  rpc GetFleetStatus(GetFleetStatusRequest) returns (GetFleetStatusResponse) {}
  // GetNodeLogs reads this Node's journal as its own screen does (decision
  // 187): one of the sources it lists, the last lines of it.
  rpc GetNodeLogs(GetNodeLogsRequest) returns (GetNodeLogsResponse) {}
  // PushStatus is the gossip (ADR 0006): a peer hands this Node its own
  // metrics sample and, when one changed or every five minutes, its Service
  // statuses (a message without them keeps the ones heard before). Kept in
  // memory only, never stored; every Node sends it to every peer every 5 s.
  rpc PushStatus(PushStatusRequest) returns (PushStatusResponse) {}
  // GetMetricsHistory returns this Node's stored metrics (decision 210):
  // each series asked for over a time range, from the finest level of
  // detail that covers it. Optional: older Nodes answer Unimplemented and
  // the Console keeps its own recent history instead.
  rpc GetMetricsHistory(GetMetricsHistoryRequest) returns (GetMetricsHistoryResponse) {}
  // ExportMetrics hands over a Service's stored metrics, and ImportMetrics
  // takes them on the Node it moved to (decision 191), so its graphs keep
  // their history. Both optional.
  rpc ExportMetrics(ExportMetricsRequest) returns (ExportMetricsResponse) {}
  rpc ImportMetrics(ImportMetricsRequest) returns (ImportMetricsResponse) {}
}

message GetMetricsHistoryRequest {
  // Series names, or prefixes ending in "/" for every series under one:
  //   node/cpu          percent of all cores
  //   node/memory       percent of memory in use
  //   node/load         1-minute load average
  //   node/temperature  degrees Celsius, highest thermal zone
  //   node/net_rx, node/net_tx  bytes per second, all non-loopback links
  //   node/pool         percent of the default Pool in use
  //   drive/<drive_id>  percent of that Drive in use
  //   service/<name>/cpu         percent of all the Node's cores
  //   service/<name>/memory      bytes in use (without reclaimable cache)
  //   service/<name>/disk_read, service/<name>/disk_write  bytes per second
  // Empty means every node/ and drive/ series.
  repeated string series = 1;
  int64 from_unix_ms = 2;
  // 0 means now.
  int64 to_unix_ms = 3;
  // About how many points the caller wants; the Node picks the finest level
  // that covers the range and does not give many more than this. 0 means
  // 300.
  int32 points = 4;
}

message GetMetricsHistoryResponse {
  repeated MetricSeries series = 1;
}

// MetricSeries is one series at one level of detail. Point i covers
// [start_unix_ms + i*step_ms, + step_ms). A point with no readings (the
// Node was off, or the series did not exist yet) is NaN in both lists.
message MetricSeries {
  string name = 1;
  int64 start_unix_ms = 2;
  int64 step_ms = 3;
  // Average of the readings in each step.
  repeated double avg = 4;
  // Highest reading in each step.
  repeated double max = 5;
}

message ExportMetricsRequest {
  string service = 1;
}

message ExportMetricsResponse {
  // The Service's series files, by name without the service/<name>/ prefix.
  map<string, bytes> files = 1;
}

message ImportMetricsRequest {
  string service = 1;
  map<string, bytes> files = 2;
}

message ImportMetricsResponse {}

message PushStatusRequest {
  // The sender's own status: node_id, metrics, services and their times.
  FleetNodeStatus status = 1;
}

message PushStatusResponse {}

message GetFleetStatusRequest {}

message GetFleetStatusResponse {
  // The answering Node's id, so the Console can tell "this Node" apart.
  string node_id = 1;
  // One entry per Node this Node knows of, itself first.
  repeated FleetNodeStatus nodes = 2;
}

// FleetNodeStatus is one Node as seen by the answering Node (ADR 0006).
message FleetNodeStatus {
  string node_id = 1;
  // True for the answering Node itself and for peers that answered
  // GetNodeInfo or gossiped within the last 60 s (ADR 0007).
  bool reachable = 2;
  // When this Node last heard from the peer (any message); now for itself.
  int64 last_seen_unix_ms = 3;
  // The last metrics sample gossiped by that Node, and when it was taken.
  // Unset when nothing was heard yet.
  NodeMetrics metrics = 4;
  int64 metrics_unix_ms = 5;
  // The last Service statuses gossiped by that Node, and when they changed.
  repeated ServiceStatus services = 6;
  int64 services_unix_ms = 7;
  // The Node's own image update, for the Console's Node status words
  // (Updating, Attention) without a call to each Node: the state and its
  // message and progress, whether an update is staged, and the last
  // rollback greenboot made (empty if none).
  UpdateStatus.State update_state = 8;
  string update_message = 9;
  double update_progress = 10;
  bool update_staged = 11;
  string last_rollback = 12;
  // Set while the Node is still being installed: the answering Node has its
  // record but never heard from it, so it asks the Installer at the
  // record's addresses (the Installer's key is the new node_id) and reports
  // what it said. Cleared once the Node talks, or an hour after its record
  // was made. Lets every Console show Provisioning, not only the one that
  // started the install.
  Provisioning provisioning = 13;
  // The Node's Maître Server version and, for a peer, the problems the
  // answering Node has calling it (PeerStatus.problems, ADR 0007).
  string version = 14;
  repeated string problems = 15;
  // The registry has a newer image for the Node's reference than it runs
  // or has staged (UpdateStatus.available).
  bool update_available = 16;
  // Out-of-sync copies this Node found in its last two syncs with each peer
  // (decision 168), in either direction: records it could not take from a
  // peer, and its own records a peer still lacks. Gossiped, so the anchor
  // reports what every Node sees.
  repeated SyncGap sync_gaps = 17;
}

// SyncGap is one Node holding older copies of records than another, found
// by comparing the two databases during sync and still there one sync
// later (decision 168).
message SyncGap {
  // The Node that is behind, and the one whose copies are newer.
  string node_id = 1;
  string ahead_node_id = 2;
  // How many records differ, and the first few as "kind id".
  uint32 count = 3;
  repeated string records = 4;
}

message PushRecordsRequest {
  repeated Record records = 1;
}

message PushRecordsResponse {
  // How many were newer than what this Node held.
  uint32 applied = 1;
}

// PeerStatus is what this Node knows about another Node of the Fleet.
message PeerStatus {
  string node_id = 1;
  string name = 2;
  // Address last reached, host:port.
  string address = 3;
  bool online = 4;
  int64 last_seen_unix_ms = 5;
  // Writes waiting for this peer to come back.
  uint32 queued = 6;
  // The peer's Maître Server version, from its last GetNodeInfo answer.
  string version = 7;
  // Calls the peer answered with an error, one sentence each (ADR 0007):
  // they make it need attention, not offline. Cleared when the same call
  // next succeeds or the peer's version changes.
  repeated string problems = 8;
}

message GetUpdateStatusRequest {}

message GetUpdateStatusResponse {
  UpdateStatus status = 1;
}

// ImageDeployment is one bootc deployment as the Console shows it.
message ImageDeployment {
  // Image reference, e.g. ghcr.io/onfire7/maitre-server:main.
  string image = 1;
  // Digest of the manifest that was pulled.
  string digest = 2;
  // Version label from the image, if any.
  string version = 3;
  // When the image was built (RFC 3339), if the image says.
  string timestamp = 4;
}

message UpdateStatus {
  ImageDeployment booted = 1;
  // Pulled and queued for the next boot; empty when nothing is staged.
  ImageDeployment staged = 2;
  // The previous image, available through Rollback; empty if none.
  ImageDeployment rollback = 3;
  // True when Rollback was called and a reboot will boot the rollback image.
  bool rollback_queued = 4;
  enum State {
    STATE_UNSPECIFIED = 0;
    // No update running.
    STATE_IDLE = 1;
    // bootc switch is downloading and staging the image.
    STATE_UPDATING = 2;
    // Last UpdateImage failed; see message.
    STATE_FAILED = 3;
    // Staging finished and a reboot was requested; the Node is going down.
    STATE_REBOOTING = 4;
  }
  State state = 5;
  // Human progress text or the failure reason.
  string message = 6;
  // 0..1 download progress while UPDATING, when bootc reports it.
  double progress = 7;
  // The image reference the running or last update was asked for.
  string target = 8;
  // False when this Node does not run on bootc (dev mode), so none of the
  // update calls work.
  bool supported = 9;
  // Set when greenboot rolled the last update back because the Node did
  // not come up healthy; cleared by the next successful update.
  string last_rollback = 10;
  // What the staged rollout decided last (Milestone 6), in words.
  string rollout = 11;
  // The digest of a newer image the registry has for the booted reference,
  // checked every 15 minutes; empty when the Node runs or has staged the
  // newest, or the registry was never reached. The Console's Update button.
  string available = 12;
}

message UpdateImageRequest {
  // Image reference to switch to, e.g. maitre-depot.local:8080/maitre-server:dev.
  string image = 1;
  // Reboot into the new image once it is staged.
  bool reboot = 2;
  // The registry speaks plain HTTP or has an untrusted certificate (a local
  // Depot on the LAN). Written to containers-registries.conf for that host.
  bool insecure_registry = 3;
}

message UpdateImageResponse {}

message RollbackRequest {
  bool reboot = 1;
}

message RollbackResponse {}

message RenameNodeRequest {
  string name = 1;
}

message RenameNodeResponse {
  Node node = 1;
}

message RebootRequest {}

message RebootResponse {}

message GetNodeMetricsRequest {}

message GetNodeMetricsResponse {
  NodeMetrics metrics = 1;
}

// NodeMetrics is a point-in-time reading; history stays on the Node.
message NodeMetrics {
  // 0..100 across all cores since the previous call (0 on the first).
  double cpu_percent = 1;
  uint64 memory_total_bytes = 2;
  uint64 memory_used_bytes = 3;
  // Default Pool capacity.
  uint64 pool_total_bytes = 4;
  uint64 pool_used_bytes = 5;
  // True when the Pool is a directory on the OS partition (no Drive).
  bool pool_fallback = 6;
  // Bytes per second over all non-loopback interfaces since the previous call.
  double net_rx_bytes_per_sec = 7;
  double net_tx_bytes_per_sec = 8;
  // Highest thermal zone reading in Celsius; 0 if none.
  double temperature_c = 9;
  double load_1m = 10;
  // Every mounted Drive of this Node: how full it is. Gossiped with the
  // rest, so the Console shows every Node's Drives from one call.
  repeated DriveUsage drives = 11;
}

// DriveUsage is one Drive's capacity, by its drive_id.
message DriveUsage {
  string drive_id = 1;
  uint64 total_bytes = 2;
  uint64 used_bytes = 3;
}

message ListRecordsRequest {
  // Empty means all kinds.
  string kind = 1;
}

message ListRecordsResponse {
  repeated Record records = 1;
}

message PutRecordRequest {
  Record record = 1;
}

message PutRecordResponse {
  Record record = 1;
  // True when the write was queued for an offline owner rather than applied.
  bool queued = 2;
}

message GetNodeInfoRequest {}

message GetNodeInfoResponse {
  NodeInfo node = 1;
}

message NodeInfo {
  // Stable identity: the Node's public key fingerprint.
  string node_id = 1;
  // Human name chosen at provisioning. Empty before provisioning.
  string name = 2;
  // Fleet this Node belongs to. Empty before provisioning.
  string fleet_id = 3;
  // Maître Server version, or "dev" when running outside the image.
  string version = 4;
  // Seconds since the agent started.
  uint64 uptime_seconds = 5;
  // True when running via `maitre dev` rather than on Maître Server.
  bool dev_mode = 6;
  // The other Nodes of the Fleet as this Node sees them (Milestone 3).
  repeated PeerStatus peers = 7;
  // Decision 115: the UPnP router this Node can ask for port forwarding
  // ("router: <name>"), "no UPnP router found", or empty before the first look.
  string port_mapping = 10;
  // This Node on the Fleet's Tailscale network (Milestone 5); unset when
  // Tailscale is not configured.
  TailscaleStatus tailscale = 8;
  // The address the internet sees this Node from (decision 112), looked up
  // through a public IP service; empty when unknown or offline.
  string public_ip = 9;
}

message GetNodeLogsRequest {
  // A source id from GetNodeLogsResponse.sources; "" is the Maître agent.
  string source = 1;
  // Default 300, at most 5000.
  uint32 lines = 2;
}

message LogSource {
  // "agent", "pool", "caddy", "health", "kernel", "system", or
  // "service:<name>" for a Service on this Node.
  string id = 1;
  string label = 2;
}

message GetNodeLogsResponse {
  repeated string lines = 1;
  // What this Node can show, the agent first.
  repeated LogSource sources = 2;
}
