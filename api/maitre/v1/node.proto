syntax = "proto3";

package maitre.v1;

import "maitre/v1/fleet.proto";

option go_package = "github.com/Onfire7/maitre-de-serveur/server/gen/maitre/v1;maitrev1";

// NodeService is served by every Node (and by the agent in dev mode).
// Callers are Trusted Devices and peer Nodes; the transport is mutual TLS
// checked against the Fleet trust list, so no auth fields appear here.
service NodeService {
  // GetNodeInfo returns identity and liveness facts about this Node.
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse) {}
  // ListRecords returns this Node's copy of the Fleet database, optionally
  // filtered by kind. Reads are always local (ADR 0003).
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse) {}
  // PutRecord writes a Record. If this Node owns it the write is applied and
  // the stored Record returned; otherwise it is forwarded to the owner, or
  // queued if the owner is offline. Version and owner in the request are
  // ignored; the caller sends the body it wants.
  rpc PutRecord(PutRecordRequest) returns (PutRecordResponse) {}
}

message ListRecordsRequest {
  // Empty means all kinds.
  string kind = 1;
}

message ListRecordsResponse {
  repeated Record records = 1;
}

message PutRecordRequest {
  Record record = 1;
}

message PutRecordResponse {
  Record record = 1;
  // True when the write was queued for an offline owner rather than applied.
  bool queued = 2;
}

message GetNodeInfoRequest {}

message GetNodeInfoResponse {
  NodeInfo node = 1;
}

message NodeInfo {
  // Stable identity: the Node's public key fingerprint.
  string node_id = 1;
  // Human name chosen at provisioning. Empty before provisioning.
  string name = 2;
  // Fleet this Node belongs to. Empty before provisioning.
  string fleet_id = 3;
  // Maître Server version, or "dev" when running outside the image.
  string version = 4;
  // Seconds since the agent started.
  uint64 uptime_seconds = 5;
  // True when running via `maitre dev` rather than on Maître Server.
  bool dev_mode = 6;
}
