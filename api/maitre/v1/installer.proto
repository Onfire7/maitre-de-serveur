syntax = "proto3";

package maitre.v1;

import "maitre/v1/fleet.proto";

option go_package = "github.com/Onfire7/maitre-de-serveur/server/gen/maitre/v1;maitrev1";

// InstallerService is served by `maitre installer` on installer media.
// The Installer has no trust list yet, so TLS accepts any client key. Trust
// is established by the pairing code: a six-digit number both the Installer
// screen and the Console derive from the two public keys. The person at the
// Console confirms they match before calling Provision.
service InstallerService {
  // GetInstallerStatus describes the machine and the pairing code for the
  // calling device. The Installer shows the same code on its screen.
  rpc GetInstallerStatus(GetInstallerStatusRequest) returns (GetInstallerStatusResponse) {}
  // Provision installs Maître Server to a disk and makes this machine a Node.
  // Returns at once; progress is read with GetInstallerStatus.
  rpc Provision(ProvisionRequest) returns (ProvisionResponse) {}
  // ListFolder lists one folder on a partition of a disk, read-only, so the
  // person setting up can tell disks apart by what they hold (decision 262).
  // Names, sizes and dates only; no file is read. Installers before this
  // answer Unimplemented.
  rpc ListFolder(ListFolderRequest) returns (ListFolderResponse) {}
  // Restarts the machine (decision 270): from the Netboot panel, after a
  // failed install or to boot new boot files. Refused while installing.
  // Installers before it answer Unimplemented.
  rpc Restart(RestartRequest) returns (RestartResponse) {}
  // The Installer's own log (its journal), newest last (decision 271), so
  // a failed install can be read without the machine's screen.
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse) {}
}

message GetInstallerStatusRequest {}

message GetInstallerStatusResponse {
  InstallerStatus status = 1;
}

message InstallerStatus {
  // Key fingerprint of the Installer; becomes the node_id after Provision.
  string installer_id = 1;
  string version = 2;
  // Addresses the Installer is reachable on. Empty until the network is up.
  repeated string addresses = 3;
  // Pairing code for the calling device, as shown on the Installer screen.
  string pairing_code = 4;
  repeated Disk disks = 5;
  Provisioning provisioning = 6;
  // Model or hostname hint to help tell machines apart in the Console.
  string machine_name = 7;
  // What this Installer will put on the disk and where it reads it from
  // (registry reference, and "registry", "media" or the explicit source).
  // Shown in the Console so a substituted image can be noticed.
  string image = 8;
  string source = 9;
  // Registry host:port it is allowed to pull from without TLS, if any.
  string insecure_registry = 10;
  // Node backups found on attached Drives (decision 102): the Console offers
  // "Restore this Node" before anything else.
  repeated Backup backups = 11;
}

// Backup is a copy of a Node's config partition found on a Drive.
message Backup {
  string node_id = 1;
  string node_name = 2;
  string fleet_id = 3;
  string fleet_name = 4;
  int64 saved_unix_ms = 5;
  // Partition holding it, e.g. /dev/sdb1, and the disk it belongs to.
  string device = 6;
  string disk = 7;
}

message Disk {
  // Stable path such as /dev/disk/by-id/....
  string path = 1;
  string model = 2;
  uint64 size_bytes = 3;
  bool removable = 4;
  // True for the disk the Installer itself booted from.
  bool is_installer_media = 5;
  // What is on it now (decision 262): its partitions, and filesystems inside
  // them (LVM volumes, a filesystem on the whole disk). Empty for a blank
  // disk, and from Installers before this.
  repeated Partition partitions = 6;
}

// Partition is a partition or other block device on a disk, as lsblk sees it.
message Partition {
  // Device path, e.g. /dev/sdb1; ListFolder takes it.
  string device = 1;
  uint64 size_bytes = 2;
  // Filesystem type as blkid names it (ext4, ntfs, vfat, crypto_LUKS,
  // LVM2_member, swap, ...); empty when none is recognised.
  string fstype = 3;
  // Filesystem label, else the GPT partition name.
  string label = 4;
  // True when ListFolder can mount it to look inside.
  bool browsable = 5;
}

message ListFolderRequest {
  // Partition.device of a disk that is not the installer media.
  string device = 1;
  // Folder within the partition, "/"-separated; empty or "/" is its top.
  string path = 2;
}

message ListFolderResponse {
  // Folders first, then files, each by name.
  repeated FolderEntry entries = 1;
  // Entries left out past the first 1000.
  uint32 more = 2;
  // The filesystem's size and use.
  uint64 used_bytes = 3;
  uint64 total_bytes = 4;
}

message FolderEntry {
  string name = 1;
  bool dir = 2;
  // Bytes, for files.
  uint64 size_bytes = 3;
  int64 modified_unix_ms = 4;
  // A symbolic link; not followed.
  bool link = 5;
}

// Provisioning is the state of an in-flight or finished install.
message Provisioning {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_IDLE = 1;
    PHASE_INSTALLING = 2;
    PHASE_CONFIGURING = 3;
    PHASE_REBOOTING = 4;
    PHASE_FAILED = 5;
  }
  Phase phase = 1;
  string message = 2;
  // 0..100 within the current phase.
  uint32 percent = 3;
  // When the phase is FAILED: the last lines the failing command printed
  // (bootc, sfdisk, mkfs), so the reason can be read without the machine's
  // journal (decision 265). Installers before it send none.
  repeated string output = 4;
}

message ProvisionRequest {
  Fleet fleet = 1;
  string node_name = 2;
  // Disk.path to install to. Everything on it is destroyed.
  string target_disk = 3;
  // Initial trust list: at least the calling device and the recovery key.
  repeated TrustedDevice trusted_devices = 4;
  // The Fleet's existing Nodes, so the new one trusts and finds them from
  // its first boot (Milestone 3). Empty for the first Node.
  repeated Node nodes = 6;
  // Restore the Node whose backup carries this node_id (from
  // InstallerStatus.backups) instead of creating a new identity: the Node
  // comes back with its key, name and Fleet database. fleet, node_name and
  // trusted_devices are ignored then.
  string restore_node_id = 7;
  // Create a data partition from the remaining space. Default off on USB.
  bool data_partition = 5;
  // Decision 189: signed records the new Node stores as they are: the
  // Fleet's Trusted Devices and other Device-signed records copied from a
  // Node, or for a new Fleet the Console's own device and the Recovery
  // Phrase, signed by the Console. When set, trusted_devices and nodes are
  // ignored.
  repeated Record records = 8;
}

message ProvisionResponse {}

message RestartRequest {}

message RestartResponse {}

message GetLogsRequest {
  // How many lines from the end; 0 means 200.
  int32 lines = 1;
}

message GetLogsResponse {
  repeated string lines = 1;
}
