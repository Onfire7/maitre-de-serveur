syntax = "proto3";

package maitre.v1;

option go_package = "github.com/Onfire7/maitre-de-serveur/server/gen/maitre/v1;maitrev1";

// Record is the unit of the Fleet database and of the sync layer (ADR 0003).
// Every Node holds every Record. Exactly one Node owns each Record and is the
// only writer; other Nodes and Trusted Devices forward writes to the owner.
// This shape is final from Milestone 1; multi-Node exchange arrives in
// Milestone 3.
message Record {
  // What kind of thing `body` holds: "fleet", "node", "trusted_device", ...
  string kind = 1;
  // Identifier unique within `kind`.
  string id = 2;
  // Node ID (key fingerprint) of the owner. Fleet-wide records such as the
  // Fleet itself and Trusted Devices are owned by the Node that last wrote
  // them and resolve newest-wins.
  string owner_node_id = 3;
  // Monotonic per Record, incremented by the owner on every write.
  uint64 version = 4;
  // Wall clock of the write, milliseconds since the Unix epoch. Used only to
  // break ties between owners for Fleet-wide records.
  int64 updated_unix_ms = 5;
  // Serialized message of the type named by `kind`.
  bytes body = 6;
  // Tombstone. Deleted Records keep their row so the deletion propagates.
  bool deleted = 7;
  // Decision 189: who wrote this content, and their Ed25519 signature over
  // kind, id, body, deleted and signed_unix_ms (server/internal/recsig).
  // Owner, version and updated_unix_ms are the storing Node's and are not
  // signed. Which keys may sign which kinds is server/internal/authz.
  // signer_key is the raw 32-byte public key; empty on records from before
  // 189, which a Node keeps but no longer accepts from others.
  bytes signer_key = 8;
  bytes signature = 9;
  // When the signer wrote it. A replacement must be signed later than what
  // it replaces, so an old signed body cannot be replayed over a newer one.
  int64 signed_unix_ms = 10;
}

// Fleet is the kind "fleet" record. There is exactly one.
message Fleet {
  string fleet_id = 1;
  string name = 2;
  int64 created_unix_ms = 3;
}

// Node is the kind "node" record, keyed by node_id.
message Node {
  string node_id = 1;
  string name = 2;
  string public_key_pem = 3;
  // Last known addresses, most recent first. Advisory; mDNS is the source of truth.
  repeated string addresses = 4;
  int64 provisioned_unix_ms = 5;
  // What the Node runs (Milestone 6 staged rollout): the booted image's
  // reference and digest, and when it booted it.
  string image_ref = 6;
  string image_digest = 7;
  int64 booted_unix_ms = 8;
  // One capital letter per Node (decision 104); its Drives get names that
  // start with it. Chosen by the Node itself: the first letter no other
  // Node holds.
  string letter = 9;
  // Self-signed P-256 certificate for NFS over TLS (decision 188), its key
  // derived from the Node's key; never changes. Peers put it in their tlshd
  // trust store when nfs_certificate_signature, the Node key's Ed25519
  // signature over its DER bytes, checks out.
  string nfs_certificate_pem = 10;
  bytes nfs_certificate_signature = 11;
  // Set by the Node itself just before an update starts and cleared when it
  // is back up (decision 214), so every Node and the Console see it as
  // updating while it is offline. Only the Node (or a Trusted Device) may
  // write its record; peers never change it.
  NodeUpdate updating = 12;
  // Its updates, oldest first, at most 20: for how long they take.
  repeated UpdateRun updates = 13;
}

// NodeUpdate is an update in progress.
message NodeUpdate {
  int64 started_unix_ms = 1;
  // The image reference it is updating to.
  string target = 2;
  // The image it ran when it started.
  string from_digest = 3;
  // The kernel's boot id when it started: still the same at the next start
  // means the agent restarted without the reboot (the update was cut short).
  string boot_id = 4;
}

// UpdateRun is one finished update.
message UpdateRun {
  int64 started_unix_ms = 1;
  // When it was back up, or when staging failed or finished without a reboot.
  int64 ended_unix_ms = 2;
  string target = 3;
  string from_digest = 4;
  // What it booted afterwards.
  string to_digest = 5;
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // Running the new image.
    OUTCOME_UPDATED = 1;
    // Booted, failed its health checks, back on the previous image.
    OUTCOME_ROLLED_BACK = 2;
    // Never reached the reboot (staging failed, or the agent stopped).
    OUTCOME_FAILED = 3;
    // Staged without a reboot: it applies at the next restart.
    OUTCOME_STAGED = 4;
  }
  Outcome outcome = 6;
  string message = 7;
}

// FleetDomain is the Fleet-wide kind "fleet_domain" Record, id "fleet"
// (decision 218): the user's own domain pointing at the home, and which
// Node the router forwards to for the app and for the web. The user makes
// the DNS records (the domain and *.domain to the home's public address).
message FleetDomain {
  // e.g. home.example.com. The app reaches the Fleet at <domain>:7443;
  // a Service published at the domain defaults to <service>.<domain>.
  string domain = 1;
  // The router forwards 7443 to one Node, so the app can reach the Fleet
  // from outside the home.
  EntryNode app = 2;
  // The router forwards 80 and 443 to one Node, whose Caddy answers every
  // Service published at the user's domain, wherever it runs.
  EntryNode web = 3;
}

// EntryNode is which Node the router forwards a role's ports to.
message EntryNode {
  bool enabled = 1;
  // Empty: the Fleet elects the least busy reachable Node and keeps it
  // until it goes away or stays much busier than another. Else this Node,
  // while it is reachable (the election otherwise).
  string node_id = 2;
}

// UpdatePolicy is the Fleet-wide kind "update_policy" Record (Milestone 6):
// how Maître Server updates roll across the Fleet by themselves.
message UpdatePolicy {
  // Check for and apply updates automatically.
  bool automatic = 1;
  // Local hours between which updates may start, e.g. 3 to 5.
  int32 window_start_hour = 2;
  int32 window_end_hour = 3;
  // The first Node updates alone; the rest follow after it has run the new
  // image this long without a rollback.
  int32 stage_hours = 4;
  // Hold everything.
  bool paused = 5;
}

// TrustedDevice is the kind "trusted_device" record, keyed by device_id
// (its key fingerprint). The Recovery Phrase appears here as a device whose
// `recovery_only` flag limits it to approving other devices.
message TrustedDevice {
  string device_id = 1;
  string name = 2;
  string public_key_pem = 3;
  bool recovery_only = 4;
  int64 added_unix_ms = 5;
  // Decision 120: set to a Node id when the device was added through that
  // Node's recovery code in a Fleet of two or more Nodes. Only that Node
  // trusts it until a recovery code at another Node, within a day, clears
  // this and makes the trust Fleet-wide. Empty: trusted by every Node.
  string node_scope = 6;
  // Decision 189: a Node may only sign a device scoped to itself. The
  // promotion of decision 120 is signed by the second Node and carries the
  // first Node's signed, scoped record as proof of presence at two machines.
  RecoveryVoucher voucher = 7;
}

// RecoveryVoucher is another Node's signed record of the same device, scoped
// to that Node (decision 189).
message RecoveryVoucher {
  // The signing Node's raw public key, signature, and signing time.
  bytes signer_key = 1;
  bytes signature = 2;
  int64 signed_unix_ms = 3;
  // The scoped TrustedDevice record's body as that Node signed it.
  bytes body = 4;
}

// Grant is the kind "grant" record (decision 189): a Trusted Device's
// consent, from a warning dialog, to one protected option of one Service on
// one Node. The record id is GrantID(node_id, service, option). A Node runs
// a Service with a protected option only when a live grant signed by a
// Trusted Device names it, the Service, this Node, and the image's
// repository; a different image needs a new grant, a new tag does not.
message Grant {
  string node_id = 1;
  string service = 2;
  // The option as server/internal/services.Protected words it, such as
  // "AddCapability=NET_ADMIN" or "Volume=/etc".
  string option = 3;
  // The image without tag or digest, such as "docker.io/jellyfin/jellyfin".
  string image_repository = 4;
  int64 granted_unix_ms = 5;
  // The device that granted it, for the Console's list.
  string device_name = 6;
}

// GrantsNeeded is the detail of a FailedPrecondition error from a Service
// call when the Service's container definition has protected options
// without grants (decision 189). The Console asks for each and retries.
message GrantsNeeded {
  string node_id = 1;
  string service = 2;
  string image_repository = 3;
  repeated string options = 4;
  // The grant record id for each option, in the same order.
  repeated string grant_ids = 5;
}
