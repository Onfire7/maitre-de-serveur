syntax = "proto3";

package maitre.v1;

option go_package = "github.com/Onfire7/maitre-de-serveur/server/gen/maitre/v1;maitrev1";

// StorageService manages one Node's Drives (Milestone 4). Tiers are
// Fleet-wide "tier" Records written through NodeService.PutRecord.
service StorageService {
  // ListDrives reports every block device the Node can see, merged with
  // its Drive records.
  rpc ListDrives(ListDrivesRequest) returns (ListDrivesResponse) {}
  // DriveContents summarises what a filesystem holds, for the Format and
  // Adopt dialogs.
  rpc DriveContents(DriveContentsRequest) returns (DriveContentsResponse) {}
  // AdoptDrive mounts an existing filesystem read-write and makes it a Drive
  // of this Node, data intact.
  rpc AdoptDrive(AdoptDriveRequest) returns (AdoptDriveResponse) {}
  // FormatDrive erases a device (btrfs) and makes it a Drive. The caller
  // must repeat the device's model or path exactly (the guard).
  rpc FormatDrive(FormatDriveRequest) returns (FormatDriveResponse) {}
  // SetDriveTags replaces a Drive's user tags.
  rpc SetDriveTags(SetDriveTagsRequest) returns (SetDriveTagsResponse) {}
  // ForgetDrive removes a Drive from the Node: unmounted, record deleted,
  // data left on the device untouched. The caller repeats the Drive's name.
  rpc ForgetDrive(ForgetDriveRequest) returns (ForgetDriveResponse) {}
}

// DriveRecord is the kind "drive" Record body, owned by the Node holding
// the Drive.
message DriveRecord {
  // Filesystem UUID: stable across ports, reboots and Nodes.
  string drive_id = 1;
  string node_id = 2;
  // Human name; defaults to the model or label.
  string name = 3;
  string model = 4;
  string serial = 5;
  uint64 size_bytes = 6;
  string fstype = 7;
  // Automatic tags: ssd, hdd, usb, nvme, and a size class (small, medium, large).
  repeated string auto_tags = 8;
  repeated string tags = 9;
  // "adopted" (existing data kept) or "formatted".
  string origin = 10;
  int64 added_unix_ms = 11;
}

// Drive is a block device as the Console sees it: live facts plus the
// record, if any.
message Drive {
  string device = 1;
  string drive_id = 2;
  string model = 3;
  string serial = 4;
  uint64 size_bytes = 5;
  bool removable = 6;
  bool rotational = 7;
  string transport = 8;
  string fstype = 9;
  string label = 10;
  // Holds the running system (OS, config or data partition made by the Installer).
  bool system = 11;
  // A Drive of this Node (record exists), mounted at mount_path.
  bool adopted = 12;
  string mount_path = 13;
  DriveRecord record = 14;
  repeated string auto_tags = 15;
  // Free space when mounted.
  uint64 free_bytes = 16;
  // For a disk not yet adopted: the name it would get (decision 104), the
  // first unused name from the list for this Node's letter.
  string suggested_name = 17;
  // For an adopted Drive: its Bins (by id), from the Fleet's rules.
  repeated string bins = 18;
  // For an adopted Drive: top-level folders on it. Each is a Bin's folder
  // (bin set), a folder of a Bin that no longer exists (orphan), or files
  // that were on the Drive before it was adopted (unsorted). Decision 124:
  // nothing here is ever deleted by the Node; the file manager moves it.
  repeated DriveFolder folders = 19;
}

message DriveFolder {
  string name = 1;
  // "bin" | "orphan" | "unsorted"
  string kind = 2;
  // The Bin id for kind "bin"; the former Bin id for "orphan".
  string bin_id = 3;
}

message ListDrivesRequest {}
message ListDrivesResponse {
  repeated Drive drives = 1;
}

message DriveContentsRequest {
  string device = 1;
}
message DriveContentsResponse {
  // Top-level entries, e.g. "Photos/ (120 GB)", at most 50.
  repeated string entries = 1;
  uint64 used_bytes = 2;
  bool empty = 3;
}

message AdoptDriveRequest {
  string device = 1;
  string name = 2;
  repeated string tags = 3;
}
message AdoptDriveResponse {
  Drive drive = 1;
}

message FormatDriveRequest {
  string device = 1;
  string name = 2;
  repeated string tags = 3;
  // Must equal the device's model (or its path when it has none).
  string confirm = 4;
}
message FormatDriveResponse {
  Drive drive = 1;
}

message SetDriveTagsRequest {
  string drive_id = 1;
  repeated string tags = 2;
  string name = 3;
}
message SetDriveTagsResponse {
  Drive drive = 1;
}

message ForgetDriveRequest {
  string drive_id = 1;
  // Must equal the Drive's name.
  string confirm = 2;
}
message ForgetDriveResponse {}

// Bin is a Storage Bin (decisions 121-128, replacing Tiers): a place for
// one kind of data. It is the kind "bin" Record body (Fleet-wide). A Drive
// is a member of every Bin whose rule matches it, and each Bin keeps its
// own folder on each member Drive (<drive>/<bin_id>/); a Node materialises
// a Bin as a Pool, mergerfs over those folders. An exclusive Bin claims its
// matching Drives for itself alone. There is no built-in Bin: the user
// defines each one and marks one as the default for new Service volumes.
message Bin {
  string bin_id = 1;
  string name = 2;
  // Where new files go among the Pool's branches:
  //   "local_first"       this Node's Drives while any has room, then peers'
  //   "most_free"         the Drive with the most free space, wherever it is
  //   "most_free_percent" the Drive with the highest share of free space
  string placement = 3;
  // Every listed tag must be on the Drive (auto or user). Empty, with no
  // node_ids: every Drive (not allowed for an exclusive Bin).
  repeated string require_tags = 4;
  // Only Drives on these Nodes; empty means any Node.
  repeated string node_ids = 5;
  // Among exclusive Bins matching the same Drive, the highest claims it.
  int32 priority = 6;
  int64 created_unix_ms = 7;
  // One Pool across every Node holding a member Drive, over the network.
  bool span_nodes = 8;
  // Member Drives belong to this Bin only.
  bool exclusive = 9;
  // New Service volumes land here unless the user picks another Bin. Exactly
  // one Bin should carry this; the newest write wins otherwise.
  bool default_for_new = 10;
}
